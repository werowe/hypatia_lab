<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="420" viewBox="0 0 1050 420" role="img"><title>Full adder: two half adders and an OR gate</title><rect width="100%" height="100%" fill="white"/><text x="24" y="32" font-family="Arial, sans-serif" font-size="23" fill="#172b4d" text-anchor="start">Full adder: two half adders and an OR gate</text><rect x="180" y="100" width="170" height="120" rx="3" fill="#f0f5fa" stroke="#263b53" stroke-width="2"/><text x="265" y="148" font-family="Arial, sans-serif" font-size="20" fill="#172b4d" text-anchor="middle">Half adder</text><text x="190" y="183" font-family="Arial, sans-serif" font-size="14" fill="#172b4d" text-anchor="start">sum</text><text x="190" y="206" font-family="Arial, sans-serif" font-size="14" fill="#172b4d" text-anchor="start">carry</text><rect x="510" y="100" width="170" height="120" rx="3" fill="#f0f5fa" stroke="#263b53" stroke-width="2"/><text x="595" y="148" font-family="Arial, sans-serif" font-size="20" fill="#172b4d" text-anchor="middle">Half adder</text><text x="520" y="183" font-family="Arial, sans-serif" font-size="14" fill="#172b4d" text-anchor="start">sum</text><text x="520" y="206" font-family="Arial, sans-serif" font-size="14" fill="#172b4d" text-anchor="start">carry</text><polyline points="75,130 180,130" fill="none" stroke="#263b53" stroke-width="2.5"/><text x="45" y="136" font-family="Arial, sans-serif" font-size="17" fill="#172b4d" text-anchor="start">x</text><polyline points="75,185 180,185" fill="none" stroke="#263b53" stroke-width="2.5"/><text x="45" y="191" font-family="Arial, sans-serif" font-size="17" fill="#172b4d" text-anchor="start">y</text><polyline points="350,130 510,130" fill="none" stroke="#263b53" stroke-width="2.5"/><text x="410" y="119" font-family="Arial, sans-serif" font-size="17" fill="#172b4d" text-anchor="start">p</text><polyline points="450,185 510,185" fill="none" stroke="#263b53" stroke-width="2.5"/><text x="420" y="191" font-family="Arial, sans-serif" font-size="17" fill="#172b4d" text-anchor="start">z</text><polyline points="680,130 930,130" fill="none" stroke="#263b53" stroke-width="2.5"/><text x="942" y="136" font-family="Arial, sans-serif" font-size="17" fill="#172b4d" text-anchor="start">s</text><polyline points="350,200 390,200 390,305 755,305" fill="none" stroke="#263b53" stroke-width="2.5"/><text x="406" y="292" font-family="Arial, sans-serif" font-size="17" fill="#172b4d" text-anchor="start">q = xy</text><polyline points="680,200 720,200 720,335 755,335" fill="none" stroke="#263b53" stroke-width="2.5"/><text x="596" y="265" font-family="Arial, sans-serif" font-size="17" fill="#172b4d" text-anchor="start">r = pz</text><rect x="755" y="285" width="90" height="70" rx="3" fill="#f0f5fa" stroke="#263b53" stroke-width="2"/><text x="800" y="325" font-family="Arial, sans-serif" font-size="24" fill="#172b4d" text-anchor="middle">≥1</text><polyline points="845,320 930,320" fill="none" stroke="#263b53" stroke-width="2.5"/><text x="942" y="326" font-family="Arial, sans-serif" font-size="17" fill="#172b4d" text-anchor="start">c</text><text x="24" y="392" font-family="Arial, sans-serif" font-size="16" fill="#172b4d" text-anchor="start">p = xy&#x27; + x&#x27;y; s = pz&#x27; + p&#x27;z; c = q + r. Lines meet only at explicit connections; no feedback.</text></svg>