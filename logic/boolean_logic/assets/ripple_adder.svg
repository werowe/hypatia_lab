<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="330" viewBox="0 0 1100 330" role="img"><title>Four-bit ripple-carry adder</title><rect width="100%" height="100%" fill="white"/><text x="24" y="32" font-family="Arial, sans-serif" font-size="23" fill="#172b4d" text-anchor="start">Four-bit ripple-carry adder</text><rect x="115" y="120" width="145" height="90" rx="3" fill="#f0f5fa" stroke="#263b53" stroke-width="2"/><text x="187" y="155" font-family="Arial, sans-serif" font-size="17" fill="#172b4d" text-anchor="middle">Full adder 0</text><text x="187" y="184" font-family="Arial, sans-serif" font-size="15" fill="#172b4d" text-anchor="middle">weight 1</text><polyline points="155,85 155,120" fill="none" stroke="#263b53" stroke-width="2.5"/><text x="155" y="72" font-family="Arial, sans-serif" font-size="18" fill="#172b4d" text-anchor="middle">x0</text><polyline points="220,85 220,120" fill="none" stroke="#263b53" stroke-width="2.5"/><text x="220" y="72" font-family="Arial, sans-serif" font-size="18" fill="#172b4d" text-anchor="middle">y0</text><polyline points="187,210 187,255" fill="none" stroke="#263b53" stroke-width="2.5"/><text x="187" y="278" font-family="Arial, sans-serif" font-size="18" fill="#172b4d" text-anchor="middle">s0</text><polyline points="260,165 355,165" fill="none" stroke="#263b53" stroke-width="2.5"/><text x="280" y="150" font-family="Arial, sans-serif" font-size="16" fill="#172b4d" text-anchor="start">c1</text><rect x="355" y="120" width="145" height="90" rx="3" fill="#f0f5fa" stroke="#263b53" stroke-width="2"/><text x="427" y="155" font-family="Arial, sans-serif" font-size="17" fill="#172b4d" text-anchor="middle">Full adder 1</text><text x="427" y="184" font-family="Arial, sans-serif" font-size="15" fill="#172b4d" text-anchor="middle">weight 2</text><polyline points="395,85 395,120" fill="none" stroke="#263b53" stroke-width="2.5"/><text x="395" y="72" font-family="Arial, sans-serif" font-size="18" fill="#172b4d" text-anchor="middle">x1</text><polyline points="460,85 460,120" fill="none" stroke="#263b53" stroke-width="2.5"/><text x="460" y="72" font-family="Arial, sans-serif" font-size="18" fill="#172b4d" text-anchor="middle">y1</text><polyline points="427,210 427,255" fill="none" stroke="#263b53" stroke-width="2.5"/><text x="427" y="278" font-family="Arial, sans-serif" font-size="18" fill="#172b4d" text-anchor="middle">s1</text><polyline points="500,165 595,165" fill="none" stroke="#263b53" stroke-width="2.5"/><text x="520" y="150" font-family="Arial, sans-serif" font-size="16" fill="#172b4d" text-anchor="start">c2</text><rect x="595" y="120" width="145" height="90" rx="3" fill="#f0f5fa" stroke="#263b53" stroke-width="2"/><text x="667" y="155" font-family="Arial, sans-serif" font-size="17" fill="#172b4d" text-anchor="middle">Full adder 2</text><text x="667" y="184" font-family="Arial, sans-serif" font-size="15" fill="#172b4d" text-anchor="middle">weight 4</text><polyline points="635,85 635,120" fill="none" stroke="#263b53" stroke-width="2.5"/><text x="635" y="72" font-family="Arial, sans-serif" font-size="18" fill="#172b4d" text-anchor="middle">x2</text><polyline points="700,85 700,120" fill="none" stroke="#263b53" stroke-width="2.5"/><text x="700" y="72" font-family="Arial, sans-serif" font-size="18" fill="#172b4d" text-anchor="middle">y2</text><polyline points="667,210 667,255" fill="none" stroke="#263b53" stroke-width="2.5"/><text x="667" y="278" font-family="Arial, sans-serif" font-size="18" fill="#172b4d" text-anchor="middle">s2</text><polyline points="740,165 835,165" fill="none" stroke="#263b53" stroke-width="2.5"/><text x="760" y="150" font-family="Arial, sans-serif" font-size="16" fill="#172b4d" text-anchor="start">c3</text><rect x="835" y="120" width="145" height="90" rx="3" fill="#f0f5fa" stroke="#263b53" stroke-width="2"/><text x="907" y="155" font-family="Arial, sans-serif" font-size="17" fill="#172b4d" text-anchor="middle">Full adder 3</text><text x="907" y="184" font-family="Arial, sans-serif" font-size="15" fill="#172b4d" text-anchor="middle">weight 8</text><polyline points="875,85 875,120" fill="none" stroke="#263b53" stroke-width="2.5"/><text x="875" y="72" font-family="Arial, sans-serif" font-size="18" fill="#172b4d" text-anchor="middle">x3</text><polyline points="940,85 940,120" fill="none" stroke="#263b53" stroke-width="2.5"/><text x="940" y="72" font-family="Arial, sans-serif" font-size="18" fill="#172b4d" text-anchor="middle">y3</text><polyline points="907,210 907,255" fill="none" stroke="#263b53" stroke-width="2.5"/><text x="907" y="278" font-family="Arial, sans-serif" font-size="18" fill="#172b4d" text-anchor="middle">s3</text><polyline points="980,165 1040,165" fill="none" stroke="#263b53" stroke-width="2.5"/><text x="1000" y="150" font-family="Arial, sans-serif" font-size="16" fill="#172b4d" text-anchor="start">c4</text><polyline points="35,165 115,165" fill="none" stroke="#263b53" stroke-width="2.5"/><text x="25" y="145" font-family="Arial, sans-serif" font-size="17" fill="#172b4d" text-anchor="start">c0 = 0</text><text x="24" y="316" font-family="Arial, sans-serif" font-size="17" fill="#172b4d" text-anchor="start">Carry travels left to right from bit 0 to bit 3. Read the numerical answer in reverse stage order: c4 s3 s2 s1 s0.</text></svg>